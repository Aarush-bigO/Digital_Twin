version: '3.8'

services:
  # Client Web Application & Digital Twin HUD
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - VITE_BACKEND_URL=http://localhost:4000
    depends_on:
      - backend

  # Doctor & Admin Clinical Portal
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "5174:80"
    environment:
      - VITE_BACKEND_URL=http://localhost:4000
    depends_on:
      - backend

  # Node.js API Gateway & WebSockets Signaling
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - ML_API_URL=http://ml-service:8000
      - MONGODB_URL=mongodb://mongo:27017/prescripto
    depends_on:
      - redis
      - mongo

  # Python ML Specialist Triage Service
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

  # Redis In-Memory Cache & Concurrency Lock
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

  # MongoDB Document Store
  mongo:
    image: mongo:6-jammy
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
